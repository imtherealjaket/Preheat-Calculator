<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Preheat Calculator</title>

  <desc id="description">
    Industrial flange and flame in a green, black, and white color scheme.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="60%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#00843d"/>
    </linearGradient>

    <linearGradient
      id="flame"
      x1="0"
      y1="1"
      x2="0"
      y2="0"
    >
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e7f4ed"/>
      <stop offset="100%" stop-color="#00843d"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <rect
    width="512"
    height="512"
    rx="104"
    fill="url(#background)"
  />

  <path
    d="M330 0 H512 V512 H420 L285 256 Z"
    fill="#00843d"
    opacity="0.96"
  />

  <g filter="url(#shadow)">
    <circle
      cx="230"
      cy="292"
      r="150"
      fill="#ffffff"
    />

    <circle
      cx="230"
      cy="292"
      r="96"
      fill="#00843d"
    />

    <circle
      cx="230"
      cy="292"
      r="56"
      fill="#111111"
    />

    <circle cx="230" cy="166" r="13" fill="#111111"/>
    <circle cx="319" cy="203" r="13" fill="#111111"/>
    <circle cx="356" cy="292" r="13" fill="#111111"/>
    <circle cx="319" cy="381" r="13" fill="#111111"/>
    <circle cx="230" cy="418" r="13" fill="#111111"/>
    <circle cx="141" cy="381" r="13" fill="#111111"/>
    <circle cx="104" cy="292" r="13" fill="#111111"/>
    <circle cx="141" cy="203" r="13" fill="#111111"/>
  </g>

  <path
    d="
      M230 48
      C187 102 181 144 202 181
      C214 201 225 213 230 231
      C238 211 254 196 268 175
      C296 132 278 87 230 48
      Z
    "
    fill="url(#flame)"
    stroke="#111111"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <path
    d="
      M230 103
      C209 134 209 157 221 178
      C226 187 229 194 230 202
      C235 191 243 182 249 171
      C262 147 253 124 230 103
      Z
    "
    fill="#00843d"
  />

  <rect
    x="126"
    y="458"
    width="208"
    height="18"
    rx="9"
    fill="#ffffff"
  />
</svg>
